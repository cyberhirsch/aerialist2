name: publish-extension

# Ships the Chrome extension via the Chrome Web Store Publish API.
# Triggers:
#   - pushing a tag like extension-v0.1.2 (must match manifest.json's version)
#   - manual dispatch, with an option to only upload (leave as a draft)
#
# Requires four repo secrets — see docs/publishing-the-extension.md for how
# to obtain them: CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET,
# CHROME_REFRESH_TOKEN.
#
# The `chrome-web-store` environment below can be given required reviewers in
# repo settings (Settings → Environments) to gate this behind manual approval
# without changing anything here.

on:
  push:
    tags:
      - 'extension-v*'
  workflow_dispatch:
    inputs:
      upload_only:
        description: 'Upload only — leave as a draft instead of submitting for review'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/extension-v}"
          manifest_version=$(node -p "require('./extension/manifest.json').version")
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag extension-v$tag_version does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: publish
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.upload_only }}" = "true" ]; then
            node scripts/publish-extension.mjs --upload-only
          else
            node scripts/publish-extension.mjs
          fi
