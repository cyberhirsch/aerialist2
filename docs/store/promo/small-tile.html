<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink-0: #0c0c0c;
    --ink-1: #161616;
    --ink-2: #222222;
    --ink-3: #3a3a3a;
    --ink-4: #6e6e6e;
    --ink-5: #a8a8a8;
    --ink-6: #d4d4d4;
    --ink-7: #f2f2f2;
    --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 440px;
    height: 280px;
    background: var(--ink-0);
    color: var(--ink-6);
    font-family: var(--font-mono);
    overflow: hidden;
  }
  .frame {
    width: 440px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 1px solid var(--ink-3);
  }
  .name {
    font-size: 34px;
    font-weight: 700;
    color: var(--ink-7);
    letter-spacing: -0.5px;
  }
  .name .two {
    color: var(--ink-4);
  }
  .tagline {
    font-size: 13px;
    color: var(--ink-5);
    text-align: center;
    line-height: 1.5;
  }
  .box {
    font-size: 11px;
    color: var(--ink-4);
    line-height: 1.3;
    margin-top: 4px;
    border: 1px solid var(--ink-3);
    padding: 8px 14px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="name">aerialist<span class="two">2</span></div>
    <div class="tagline">true PDF text editing<br>100% in your browser</div>
    <div class="box">parses. edits. saves.</div>
  </div>
</body>
</html>
